name: keres-verification

# Production wiring for the reference age-verification service. It joins nothing of the Keres server compose: the
# service runs on its own host/port (behind a reverse proxy, its own public address), and the Keres server points at
# it with AGE_VERIFICATION_URL. Secrets come from a separate env file that never leaves this machine.
#
# Two named volumes, and they are not the same kind of thing:
#   - verification-data: the encrypted images and the metadata. The service copies it nightly into verification-backups.
#   - verification-keys: the data keys that make the images readable. NEVER backed up, on purpose: a backup of the
#     data without the keys is a pile of ciphertext, and a destroyed key makes every copy unreadable. Losing this
#     volume loses the pending submissions (people send again), not the decided results (those live on Keres).
#   - verification-backups: the nightly copies of verification-data (see README, "Backups"). Copy it off the machine
#     to encrypted storage with access limited to operators: a backup is personal data too.
services:
  verification:
    # The Dockerfile copies the workspace root (bun.lock, packages/shared), so the context is the repo root.
    build:
      context: ../..
      dockerfile: apps/verification/Dockerfile
    image: ghcr.io/caiofviana/keres-verification:${VERIFICATION_IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - ${VERIFICATION_ENV_FILE:-.env}
    environment:
      PORT: "3102"
      # Backups go to their own volume only (below). Never point this at the data or the keys volume: the service
      # refuses to start in that layout.
      BACKUP_DIR: /app/apps/verification/backups
    # Loopback only: the outside world talks to the reverse proxy, never to this port directly.
    ports:
      - "${VERIFICATION_BIND_ADDRESS:-127.0.0.1}:${VERIFICATION_PORT:-3102}:3102"
    volumes:
      - verification-data:/app/apps/verification/data
      - verification-keys:/app/apps/verification/keys
      # Mounted only here, at BACKUP_DIR: the nightly copy of the data (ciphertext, no keys). It must be copied off the
      # machine to encrypted storage, with access limited to operators. The keys volume is still never backed up.
      - verification-backups:/app/apps/verification/backups
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3102/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  # Backed up (encrypted images and metadata; see README).
  verification-data:
  # Never backed up. Its contents are the keys of the data above.
  verification-keys:
  # The nightly backups of verification-data (ciphertext and metadata, never keys). Copy off the machine to encrypted
  # storage with access limited to operators; verification-keys is still never backed up, and not into here either.
  verification-backups:
