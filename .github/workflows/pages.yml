name: GitHub Pages

# A landing em apps/site. Corre no master (branch padrão) e no ouroboros (linha
# ativa), e também à mão, para poder publicar uma revisão sem esperar o merge.
on:
  push:
    branches: [master, ouroboros]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  BUN_VERSION: '1.2.19'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build landing
        run: bun run --cwd apps/site build
        env:
          # GitHub Pages de projeto vive em /<repo>/. O nome do repositório
          # preserva maiúsculas (`Keres`), e o Vite precisa do mesmo prefixo
          # nos assets — senão o site abre sem CSS.
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
