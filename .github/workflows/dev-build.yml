name: Dev build

# Development tags only - compiles the whole system into run artifacts, without creating a
# GitHub Release, without publishing a Docker image, and without touching the `latest` tag.
# Cut one with:
#   git tag v1.2.3-dev1 && git push origin v1.2.3-dev1
# Plain release tags (`v1.2.3`) are handled by `release.yml`, which excludes this pattern.
on:
  push:
    tags:
      - 'v*.*.*-dev*'

run-name: Dev build ${{ github.ref_name }}

# Unlike releases, dev builds supersede each other: a newer tag makes an older build
# irrelevant, so cancel it instead of queueing behind it.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version pinned in release.yml, for the same reason: always install with the lockfile
  # format bun.lock was generated with.
  BUN_VERSION: '1.2.19'

jobs:
  # Turns the pushed tag (e.g. "v1.2.3-dev1") into the plain version string every other job
  # needs - computed once here instead of repeating the same `${GITHUB_REF_NAME#v}` strip in
  # every job.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - id: compute
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # Validate the complete monorepo once before starting the platform-specific builds - the
  # same gate releases go through (`release:check --ci`), since a dev tag stamps the same
  # version files.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Translations, typecheck, lint, formatting, version alignment, and the unit suites with
      # coverage. The integration suites stay out on purpose, same as in release.yml: they
      # have their own job in ci.yml.
      - run: bun run release:check --ci

  # ---- Server: compile the API's Docker image (no push) ----
  docker:
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # The version script changes the build context before Docker sees it. Unlike the other
      # jobs, this one does not need a host-side dependency install: the Dockerfile installs
      # the dependencies in its own build stages. It does need Bun to run that script.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # GHCR requires a lowercase image path; this repo's owner/name aren't guaranteed to be
      # (GitHub usernames/repo names can contain uppercase letters, and `github.repository`
      # preserves whatever casing they were created with).
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - run: bun scripts/ci/set-version.ts ${{ needs.version.outputs.version }}

      # Build only - a dev tag must never publish an image, and especially never move `latest`.
      - uses: docker/build-push-action@v6
        env:
          # build-push-action v6 auto-uploads a GitHub Actions artifact with the build's summary
          # (a proprietary `.dockerbuild` file, not a real zip) for Docker Desktop's dashboard
          # integration - not needed here, so turned off at the source.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}

  # ---- Desktop: Windows (nsis installer + portable exe) ----
  desktop-windows:
    needs: [version, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Root install, not just apps/desktop: packaging first builds the client's web export
      # (`prebuild` → `bun run --cwd ../client build`), so the client's own dependency tree is
      # needed too.
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci/set-version.ts ${{ needs.version.outputs.version }}
      - name: Build Windows installer + portable exe
        working-directory: apps/desktop
        run: bun run package:win
        env:
          # No signing certificate configured yet (see electron-builder.yml) - without this,
          # electron-builder still tries to auto-discover a local dev certificate and fails the
          # build on a runner that has none. Explicitly unsigned build until a cert is added.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-windows-installer
          path: apps/desktop/release/Keres-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-windows-portable
          path: apps/desktop/release/Keres-Portable-*.exe
          if-no-files-found: error

  # ---- Desktop: macOS (dmg) ----
  desktop-mac:
    needs: [version, verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci/set-version.ts ${{ needs.version.outputs.version }}
      - name: Build macOS dmg
        working-directory: apps/desktop
        run: bun run package:mac
        env:
          # Same reasoning as desktop-windows - no Apple Developer certificate configured yet.
          # An unsigned/unnotarized .dmg still opens locally via right-click > Open; it just
          # can't be double-clicked past Gatekeeper without that first step.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-mac
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  # ---- Desktop: Linux (AppImage + Flatpak) ----
  desktop-linux:
    needs: [version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci/set-version.ts ${{ needs.version.outputs.version }}
      # electron-builder's flatpak target shells out to `flatpak-builder`, which needs the
      # Freedesktop Platform/SDK runtime already installed on the runner - it does not fetch
      # this itself. Version pinned here must match `flatpak.runtimeVersion` in
      # electron-builder.yml.
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
      - name: Build AppImage + Flatpak
        working-directory: apps/desktop
        run: bun run package:linux
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-linux-appimage
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-linux-flatpak
          path: apps/desktop/release/*.flatpak
          if-no-files-found: error

  # ---- Mobile: Android (signed APK + AAB) ----
  # iOS is deliberately out of scope: it needs a paid Apple Developer account, a real bundle
  # identifier (apps/client/app.json has none set today), and a macOS runner just to produce an
  # unsigned build that still can't be sideloaded onto a real device without that same account.
  mobile-android:
    needs: [version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Belt-and-suspenders: GitHub's ubuntu-latest runners ship an Android SDK already, but
      # pin/verify it explicitly rather than relying on whatever happens to be preinstalled.
      - uses: android-actions/setup-android@v4
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci/set-version.ts ${{ needs.version.outputs.version }}
      # `android/` is gitignored (generated, not source) - this recreates it fresh from
      # apps/client/app.json on every build.
      - name: Generate native Android project
        working-directory: apps/client
        run: bunx expo prebuild --platform android --non-interactive
      - name: Set Android versionCode/versionName
        working-directory: apps/client
        run: bun scripts/ci/set-android-version.ts ${{ needs.version.outputs.version }}
      - name: Wire up release signing
        working-directory: apps/client
        run: bun scripts/ci/patch-android-release-signing.ts
      - name: Decode release keystore
        working-directory: apps/client/android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore.jks
      - name: Build signed release APK + AAB
        working-directory: apps/client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -PRELEASE_STORE_FILE=release.keystore.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - uses: actions/upload-artifact@v5
        with:
          name: mobile-android-apk
          path: apps/client/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: mobile-android-aab
          path: apps/client/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---- Keres Server: portable zip of the API (SQLite, no Docker) per OS ----
  # Built on each platform's runner because libSQL's native sidecar has to match the target;
  # Bun's `--target` does not bring the right `.node`.
  keres-server:
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: keres-server-windows
          - os: ubuntu-latest
            artifact: keres-server-linux
          - os: macos-latest
            artifact: keres-server-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci/set-version.ts ${{ needs.version.outputs.version }}
      - name: Install zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Package Keres Server
        run: bun run api:build
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: apps/api/dist-server/Keres-Server-*.zip
          if-no-files-found: error
