version: '3.8'

services:
  db:
    container_name: keres_database
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: keres_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    container_name: keres_api
    build:
      context: ../../ # Build context is the monorepo root
      dockerfile: apps/api/Dockerfile # Dockerfile is in apps/api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../../apps/api/.env
    environment:
      PORT: 3000
    depends_on:
      - db
    # Optional: Mount the local code for development, so changes are reflected without rebuilding
    volumes:
      - ../../apps/api:/app/apps/api # Mount API specific code
      - ../../packages:/app/packages # Mount shared packages
      - /app/node_modules # Exclude node_modules from host mount to prevent issues

volumes:
  db_data:
