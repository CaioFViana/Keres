name: CI

# Every change, not only releases: `release.yml` fires on tags alone, so without this workflow
# a regression would only show up when cutting the version.
on:
  push:
    branches: ['**']
  pull_request:

# A new push on the same branch/PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version pinned in release.yml, for the same reason: always install with the lockfile
  # format bun.lock was generated with.
  BUN_VERSION: '1.2.19'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # All three aggregate every package (see scripts/run-all.ts); `typecheck` also covers the
      # repository's own scripts.
      - run: bun run typecheck
      - run: bun run lint
      # With coverage, not `bun run test`: that is what enforces the thresholds set in each
      # workspace. Without it the floors would sit in the file and never be checked.
      - run: bun run test:coverage

  # Separate from `verify` so a database failure is not mistaken for a code failure, and so both
  # run in parallel. The local equivalent is
  # `docker compose -f apps/api/docker-compose.test.yml up -d && bun run test:integration`.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keres_test
          POSTGRES_PASSWORD: keres_test
          POSTGRES_DB: keres_test
        ports:
          - 45432:5432
        options: >-
          --health-cmd "pg_isready -U keres_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The S3 test uses a real SeaweedFS at localhost:8333. Without this service the job started
      # Postgres alone, even though docker-compose.test.yml defines both.
      seaweedfs:
        image: chrislusf/seaweedfs
        env:
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: secret
          S3_BUCKET: my-bucket
        ports:
          - 8333:8333
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:9333/cluster/status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same port the service above publishes and the same default as `test/setup.ts`.
      DATABASE_URL: postgres://keres_test:keres_test@localhost:45432/keres_test
      JWT_SECRET: ci-jwt-secret-that-is-at-least-thirty-two-characters
      JWT_SECRET_REFRESH: ci-refresh-secret-that-is-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/api test:integration:coverage
